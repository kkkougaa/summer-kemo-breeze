<!DOCTYPE html>
<html lang="ko-JP">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUMMER KEMO BREEZE</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --card: #1c2330;
    --elevated: #21262d;
    --sky: #38bdf8;
    --sky-dim: #0ea5e9;
    --sky-glow: rgba(56,189,248,.15);
    --sky-border: rgba(56,189,248,.25);
    --green: #1db954;
    --gold: #fbbf24;
    --text: #f0f6fc;
    --text-secondary: #8b949e;
    --border: #30363d;
    --font: 'Noto Sans KR','Noto Sans JP',sans-serif;
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    word-break: keep-all;
  }
  body::before {
    content:'';
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse 60% 50% at 10% 40%, rgba(56,189,248,.07) 0%, transparent 60%),
      radial-gradient(ellipse 40% 60% at 90% 20%, rgba(14,165,233,.05) 0%, transparent 55%);
    pointer-events: none; z-index: 0;
  }

  /* ── HEADER ── */
  header { display: none; }
  .logo {
    display: flex; align-items: center; gap: 10px;
  }
  .logo-icon {
    width: 32px; height: 32px;
    background: linear-gradient(135deg, var(--sky), var(--sky-dim));
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1rem;
    box-shadow: 0 0 16px rgba(56,189,248,.4);
  }
  .logo-text {
    font-size: 1.1rem; font-weight: 700; letter-spacing: .04em;
    color: var(--text);
  }
  .logo-sub {
    font-size: .72rem; font-weight: 400;
    color: var(--text-secondary); letter-spacing: .02em;
  }
  .header-right { display: flex; align-items: center; gap: 12px; }

  .live-pill {
    display: flex; align-items: center; gap: 6px;
    background: rgba(29,185,84,.12);
    border: 1px solid rgba(29,185,84,.3);
    border-radius: 20px; padding: 5px 12px;
    font-size: .72rem; font-weight: 600; letter-spacing: .1em;
    color: var(--green);
  }
  .live-dot { width:6px; height:6px; border-radius:50%; background:var(--green); animation: blink 1.4s ease-in-out infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

  .conn-pill {
    display: flex; align-items: center; gap: 6px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px; padding: 5px 12px;
    font-size: .72rem; color: var(--text-secondary); font-weight: 500;
  }
  .conn-dot { width:6px; height:6px; border-radius:50%; background:#22c55e; transition: background .3s; }
  .conn-dot.off { background: #4b5563; }

  /* ── MAIN LAYOUT ── */
  .main {
    position: relative; z-index: 1;
    display: grid; grid-template-columns: 1fr 210px;
    flex: 1; overflow: hidden;
  }

  /* ── LEFT: PLAYER ── */
  .player-side {
    display: flex; flex-direction: column;
    padding: 12px; gap: 10px; overflow-y: auto; overflow-x: hidden;
  }

  .video-wrap {
    position: relative; width: 100%; padding-top: 56.25%;
    border-radius: 12px; overflow: hidden;
    background: #000;
    border: 1px solid var(--border);
    box-shadow: 0 8px 40px rgba(0,0,0,.5), 0 0 60px var(--sky-glow);
    flex-shrink: 0;
  }
  .video-wrap iframe { position:absolute; inset:0; width:100%; height:100%; border:none; }
  #ytPlayer iframe { position:absolute; inset:0; width:100%; height:100%; border:none; }
  .video-placeholder {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; color: var(--text-secondary);
    background: linear-gradient(135deg, #161b22, #0d1117);
  }
  .placeholder-icon {
    width: 64px; height: 64px;
    background: var(--card);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.8rem;
    border: 1px solid var(--border);
  }
  .placeholder-text { font-size: .9rem; font-weight: 500; color: var(--text-secondary); }
  .placeholder-sub { font-size: .75rem; color: #4b5563; margin-top: -8px; }

  /* Now Playing card — Spotify style */
  .now-playing-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 14px;
    display: flex; align-items: center; gap: 10px;
  }
  .np-thumb {
    width: 40px; height: 40px;
    border-radius: 6px;
    object-fit: cover;
    background: var(--elevated);
    flex-shrink: 0;
    border: 1px solid var(--border);
  }
  .np-thumb-placeholder {
    width: 40px; height: 40px;
    border-radius: 6px;
    background: var(--elevated);
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.3rem; flex-shrink: 0;
  }
  .np-info { flex: 1; min-width: 0; }
  .np-label { display: none; }
  .np-title {
    font-size: 1.64rem; font-weight: 700; line-height: 1.3;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    color: var(--text);
  }

  .np-req { display: none; }
  .np-req span { color: var(--gold); font-weight: 600; }

  .visualizer-mini { display: none; }
  .vbar {
    width: 3px; background: var(--sky); border-radius: 2px; opacity: .8;
    animation: bar-dance var(--dur) ease-in-out infinite alternate;
  }
  @keyframes bar-dance { from{height:3px} to{height:var(--max-h)} }

  .controls { display: flex; gap: 10px; align-items: center; justify-content: flex-start; align-self: flex-start; }
  .btn {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 500px; padding: 10px 20px;
    color: var(--text); font-family: var(--font);
    font-size: .85rem; font-weight: 600; cursor: pointer;
    transition: all .2s; letter-spacing: .02em;
  }
  .btn:hover { background: var(--elevated); border-color: var(--sky-border); color: var(--sky); }
  .btn.primary {
    background: var(--sky); border: none; color: #0d1117;
  }
  .btn.primary:hover { background: #7dd3fc; }
  .btn-icon { font-size: 1rem; }

  /* ── RIGHT: QUEUE ── */
  .queue-side {
    background: var(--surface);
    border-left: 1px solid var(--border);
    display: flex; flex-direction: column; overflow: hidden;
  }

  .queue-header {
    padding: 10px 10px 8px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .queue-title-row {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 2px;
  }
  .queue-title { font-size: .78rem; font-weight: 700; }
  .queue-title-jp { font-size: .72rem; color: var(--text-secondary); font-weight: 400; margin-bottom: 8px; }
  .q-count {
    background: var(--sky-glow);
    border: 1px solid var(--sky-border);
    border-radius: 20px; padding: 3px 10px;
    font-size: .72rem; color: var(--sky); font-weight: 600;
  }

  .queue-list {
    flex: 1; overflow-y: auto;
    padding: 8px;
    display: flex; flex-direction: column; gap: 2px;
  }
  .queue-list::-webkit-scrollbar { width: 4px; }
  .queue-list::-webkit-scrollbar-track { background: transparent; }
  .queue-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  /* Spotify-style track row */
  .q-item {
    border-radius: 6px;
    padding: 5px 8px;
    display: flex; gap: 6px; align-items: center;
    cursor: pointer; transition: background .15s;
    position: relative;
  }
  .q-item:hover { background: var(--card); }
  .q-item.next-up { background: rgba(56,189,248,.08); }
  .q-item.next-up::before {
    content:''; position:absolute; left:0; top:4px; bottom:4px;
    width:3px; background:var(--sky); border-radius:0 2px 2px 0;
  }

  .q-num { font-size: .8rem; color: var(--text-secondary); min-width: 20px; text-align: center; font-weight: 500; }
  .q-next-badge {
    display: none; font-size: .6rem; font-weight: 700;
    color: var(--sky); min-width: 20px; text-align: center;
    letter-spacing: .05em;
  }
  .q-item.next-up .q-num { display: none; }
  .q-item.next-up .q-next-badge { display: block; }

  .q-thumb { width:36px; height:27px; border-radius:3px; object-fit:cover; background:var(--elevated); flex-shrink:0; }
  .q-info { flex:1; min-width:0; }
  .q-title { font-size:.72rem; font-weight:600; color:var(--text); white-space:normal; line-height:1.3; margin-bottom:2px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .q-meta { display:flex; align-items:center; gap:6px; }
  .q-requester { font-size:.72rem; color:var(--text-secondary); }
  .q-requester em { color:var(--sky); font-style:normal; font-weight:600; }
  .q-duration { font-size:.7rem; color:#4b5563; }

  .empty-q {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; height: 100%; gap: 10px;
    color: var(--text-secondary);
  }
  .empty-q-icon {
    width: 56px; height: 56px; border-radius: 50%;
    background: var(--card); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center; font-size: 1.5rem;
  }
  .empty-q p { font-size: .85rem; font-weight: 500; }
  .empty-q small { font-size: .72rem; color: #4b5563; }

  .queue-footer { padding: 12px 12px; border-top: 1px solid var(--border); flex-shrink: 0; }

  /* next toast */
  .next-toast {
    position:fixed; bottom:24px; left:50%;
    transform:translateX(-50%) translateY(60px);
    background: var(--card); border: 1px solid var(--sky-border);
    border-radius: 10px; padding: 10px 16px;
    font-size: .82rem; font-weight: 500;
    color: var(--sky);
    box-shadow: 0 8px 28px rgba(0,0,0,.4);
    transition: transform .3s cubic-bezier(.34,1.56,.64,1);
    z-index: 999; white-space: nowrap;
  }
  .next-toast.show { transform: translateX(-50%) translateY(0); }

  /* 🐱 Running Cat */
  .running-cat {
    position: fixed;
    bottom: 18px;
    left: calc(100% + 160px);
    width: 140px;
    height: 140px;
    z-index: 8888;
    pointer-events: none;
    animation:
      cat-run 10s linear forwards,
      cat-bob 0.2s ease-in-out infinite alternate;
  }
  .running-cat img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    filter: drop-shadow(2px 4px 8px rgba(0,0,0,.4));
  }
  @keyframes cat-run {
    0%   { left: calc(100% + 160px); }
    100% { left: -160px; }
  }
  @keyframes cat-bob {
    0%   { transform: translateY(0px) rotate(-1.5deg); }
    100% { transform: translateY(-12px) rotate(1.5deg); }
  }

  /* 🍕 Pizza animation */
  .pizza-fly {
    position: fixed;
    font-size: 2.8rem;
    z-index: 9999;
    pointer-events: none;
    right: -80px;
    filter: drop-shadow(0 4px 12px rgba(255,107,53,.5));
    animation: pizza-whoosh 1.6s cubic-bezier(.25,.46,.45,.94) forwards;
  }
  @keyframes pizza-whoosh {
    0%   { right: -80px; opacity: 0; transform: rotate(0deg) scale(.7); }
    10%  { opacity: 1; }
    100% { right: 110%; opacity: 1; transform: rotate(-540deg) scale(1); }
  }

  /* 🔔 queue-toast */
  .queue-toast {
    position: fixed; bottom: 24px; right: 24px;
    transform: translateY(80px); opacity: 0;
    background: var(--card);
    border: 1px solid var(--sky-border);
    border-radius: 12px; padding: 12px 16px;
    font-size: .82rem; font-weight: 500; color: var(--text);
    box-shadow: 0 8px 28px rgba(0,0,0,.45);
    transition: transform .35s cubic-bezier(.34,1.56,.64,1), opacity .35s;
    z-index: 998;
    display: flex; align-items: flex-start; gap: 8px;
    pointer-events: none;
  }
  .queue-toast.show { transform: translateY(0); opacity: 1; }
  .queue-toast-body { display: flex; flex-direction: column; gap: 3px; }
  .queue-toast-kr, .queue-toast-jp { font-size: .82rem; font-weight: 500; color: var(--text); white-space: nowrap; }

  /* 🍫 Pino fly */
  .pino-fly {
    position: fixed;
    z-index: 9999;
    pointer-events: none;
    right: -160px;
    display: flex; align-items: center; gap: 10px;
    animation: pino-whoosh 10.67s linear forwards;
    align-items: center;
  }
  .pino-fly img {
    width: 80px; height: 80px; object-fit: contain;
    filter: drop-shadow(0 4px 16px rgba(92,51,23,.6));
  }
  .pino-fly-msg {
    font-size: 1.8rem; font-weight: 700;
    color: #fff;
    white-space: nowrap;
    text-shadow: 0 2px 8px rgba(0,0,0,.8);
  }
  .pino-fly-name {
    font-weight: 900;
    color: #fbbf24;
  }
  .pino-fly-translation {
    font-size: 1.35rem; font-weight: 500;
    color: rgba(255,255,255,.55);
    white-space: nowrap;
    text-shadow: 0 1px 4px rgba(0,0,0,.8);
    margin-top: 4px;
  }
  .pino-fly-text-wrap {
    display: flex; flex-direction: column; justify-content: center;
  }
  @keyframes pino-whoosh {
    0%   { right: -160px; opacity: 0; }
    8%   { opacity: 1; }
    100% { right: 110%; opacity: 1; }
  }

  /* 프로필 아바타 공통 */
  .q-avatar {
    width: 22px; height: 22px; border-radius: 50%;
    object-fit: cover; flex-shrink: 0;
    border: 1.5px solid var(--sky-border);
  }
  /* 이퀄라이저 옆 회전 아바타 */
  .np-avatar {
    width: 68px; height: 68px; border-radius: 50%;
    object-fit: cover; flex-shrink: 0;
    border: 2px solid var(--sky);
    animation: avatar-spin 8s linear infinite;
    transition: opacity .3s, transform .3s;
    opacity: 0;
    transform: scale(0);
  }
  .np-avatar.visible {
    opacity: 1;
    transform: scale(1);
  }
  @keyframes avatar-spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
  /* 피노 날아가기 프로필 */
  .pino-avatar {
    width: 80px; height: 80px; border-radius: 50%;
    object-fit: cover; flex-shrink: 0;
    border: 3px solid #fff;
    filter: drop-shadow(0 4px 16px rgba(0,0,0,.5));
  }

  /* 📢 공지 오버레이 */
  .notice-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.75);
    z-index: 99999;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity .5s;
  }
  .notice-overlay.show { opacity: 1; pointer-events: all; }
  .notice-overlay.hide { opacity: 0; }
  .notice-box {
    width: 50vw; min-width: 320px;
    background: var(--card);
    border: 2px solid var(--sky);
    border-radius: 20px;
    padding: 48px 40px;
    text-align: center;
    box-shadow: 0 0 80px rgba(56,189,248,.3), 0 20px 60px rgba(0,0,0,.6);
    display: flex; flex-direction: column; gap: 20px; align-items: center;
    animation: notice-in .5s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes notice-in {
    from { transform: scale(.85); opacity: 0; }
    to   { transform: scale(1);   opacity: 1; }
  }
  .notice-label {
    font-size: .8rem; font-weight: 700; letter-spacing: .2em;
    color: var(--sky); text-transform: uppercase;
  }
  .notice-msg {
    font-size: clamp(1.2rem, 3vw, 2rem);
    font-weight: 700; color: var(--text);
    line-height: 1.5; word-break: keep-all;
  }
  .notice-timer {
    font-size: .75rem; color: var(--text-secondary);
  }
  .notice-bar-wrap {
    width: 100%; height: 4px; background: var(--border); border-radius: 4px; overflow: hidden;
  }
  .notice-bar {
    height: 100%; background: var(--sky); border-radius: 4px;
    width: 100%;
    transition: width linear;
  }

  .np-next-btn {
    flex-shrink: 0;
    background: var(--elevated);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 1.1rem;
    width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: background .15s, transform .1s;
  }
  .np-next-btn:hover { background: var(--border); }
  .np-next-btn:active { transform: scale(.9); }
</style>
</head>
<body>

<header>

  <div class="header-right"></div>
</header>

<div class="main">
  <!-- Player -->
  <div class="player-side">
    <div class="video-wrap" id="videoWrap">
      <div id="ytPlayer" style="position:absolute;inset:0;width:100%;height:100%;"></div>
      <div class="video-placeholder" id="placeholder">
        <div class="placeholder-icon">🎬</div>
        <div class="placeholder-text">신청된 곡이 없습니다</div>
        <div class="placeholder-sub">リクエストされた曲がありません</div>
      </div>
    </div>

    <div class="now-playing-card">
      <div class="np-thumb-placeholder" id="npThumbWrap">🎵</div>
      <div class="np-info">
        <div class="np-label" id="npLabel">▶ Now Playing / 再生中</div>
        <div class="np-title" id="npTitle">대기 중... / 待機中...</div>
      </div>
      <img class="np-avatar" id="npAvatar" src="" alt="">
      <button class="np-next-btn" onclick="playNext()" title="다음 곡">⏭</button>
    </div>


  </div>

  <!-- Queue -->
  <div class="queue-side">
    <div class="queue-header">
      <div class="queue-title-row">
        <div class="q-count" id="qCount">0곡</div>
      </div>
    </div>
    <div class="queue-list" id="qList">
      <div class="empty-q">
        <div class="empty-q-icon">🎼</div>
        <p>대기열이 비어있습니다</p>
        <small>キューが空です</small>
      </div>
    </div>

  </div>
</div>

<div class="next-toast" id="nextToast"></div>
<div class="queue-toast" id="queueToast">
  <span>🎵</span>
  <div class="queue-toast-body">
    <span class="queue-toast-kr" id="queueToastKr"></span>
    <span class="queue-toast-jp" id="queueToastJp"></span>
  </div>
</div>

<script>
const YT_KEY = 'AIzaSyBD9yUSh6zPNjTCemaXwNygdAPEy6v5SkQ';
const PLAYLIST_ID = 'PLoX3J3oC8g6titO2njTSMi8f42CoJzOib';

const firebaseConfig = {
  apiKey: "AIzaSyCX_md-IrLMN5_-nW42A7EaKtQNgZC3HmA",
  authDomain: "summer-kemo-breeze.firebaseapp.com",
  databaseURL: "https://summer-kemo-breeze-default-rtdb.firebaseio.com",
  projectId: "summer-kemo-breeze",
  storageBucket: "summer-kemo-breeze.firebasestorage.app",
  messagingSenderId: "803543859257",
  appId: "1:803543859257:web:6554d418dfba45ec114de8"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const queueRef = db.ref('queue');
const currentRef = db.ref('current');
const nextKeyRef = db.ref('nextKey');
const bgModeRef  = db.ref('bgMode'); // 배경 플레이리스트 재생 중 여부
let queue=[], current=null, nextKey=null;
let bgMode = false;
let bgPlaylist = [], bgIndex = 0, bgLoading = false;

// Visualizer 비활성화

// Connection (UI 제거됨, Firebase 연결만 유지)
db.ref('.info/connected').on('value', s => { /* 연결 상태 모니터링 */ });

// 변수 선언 위로 이동됨

// 🔔 신곡 추가 토스트
let queueToastInit = false;
let queueToastTimer;
queueRef.on('child_added', function(snap) {
  if (!queueToastInit) return;
  const item = snap.val();
  if (!item) return;
  const requester = item.requester || '누군가';
  const title = item.title || '곡';
  document.getElementById('queueToastKr').textContent = requester + '님이 ' + title + '을(를) 대기열에 추가했습니다!';
  document.getElementById('queueToastJp').textContent = requester + 'さんが ' + title + ' をキューに追加しました!';
  const toast = document.getElementById('queueToast');
  toast.classList.add('show');
  clearTimeout(queueToastTimer);
  queueToastTimer = setTimeout(function(){ toast.classList.remove('show'); }, 3500);
});
queueRef.once('value', function(){ queueToastInit = true; });

queueRef.on('value', snap => {
  const data = snap.val();
  queue = data ? Object.entries(data).map(([k,v])=>({...v,_key:k})).sort((a,b)=>a.addedAt-b.addedAt) : [];
  renderQueue();
  currentRef.get().then(s => {
    if (!s.val()) {
      if (queue.length > 0) playNext();
      else startBgPlaylist();
    }
  });
});
currentRef.on('value', snap => { current=snap.val(); renderPlayer(); renderQueue(); });
nextKeyRef.on('value', snap => { nextKey=snap.val(); renderQueue(); });
bgModeRef.on('value', snap => { bgMode = !!snap.val(); renderBgBadge(); });

function renderQueue() {
  const list = document.getElementById('qList');
  document.getElementById('qCount').textContent = queue.length+'곡';
  if (!queue.length) {
    list.innerHTML=`<div class="empty-q"><div class="empty-q-icon">🎼</div><p>대기열이 비어있습니다</p><small>キューが空です</small></div>`;
    return;
  }
  list.innerHTML = queue.map((item,i) => `
    <div class="q-item ${item._key===nextKey?'next-up':''}" onclick="setNextSong('${item._key}','${esc(item.title)}')">
      <div class="q-num">${i+1}</div>
      <div class="q-next-badge">NEXT</div>
      ${item.xAvatar ? `<img class="q-avatar" src="${item.xAvatar}" onerror="this.style.display='none'" alt="">` : ''}
      <img class="q-thumb" src="${item.thumbnail}" onerror="this.style.opacity=0" alt="">
      <div class="q-info">
        <div class="q-title">${esc(item.title)}</div>
        <div class="q-meta">
          <div class="q-requester">신청자 <em>${esc(item.requester)}</em></div>
          ${item.duration?`<div class="q-duration">· ${item.duration}</div>`:''}
        </div>
      </div>
    </div>`).join('');
}

// ── YouTube IFrame API ──
let ytPlayer = null;
let ytReady = false;
let pendingVideoId = null;

window.onYouTubeIframeAPIReady = function() {
  ytReady = true;
  ytPlayer = new YT.Player('ytPlayer', {
    height: '100%', width: '100%',
    playerVars: { autoplay: 1, rel: 0, modestbranding: 1 },
    events: {
      onStateChange: onYTStateChange,
      onError: onYTError
    }
  });
  if (pendingVideoId) {
    const { videoId, startedAt } = typeof pendingVideoId === 'object' ? pendingVideoId : { videoId: pendingVideoId, startedAt: null };
    loadVideo(videoId, startedAt);
    pendingVideoId = null;
  }
};

function onYTStateChange(e) {
  if (e.data === YT.PlayerState.ENDED) {
    if (bgMode) {
      // 배경 재생 중 끝남
      if (queue.length > 0) {
        // 대기열에 곡 있으면 → 대기열로 전환
        playNext();
      } else {
        // 계속 배경 재생
        playBgNext();
      }
    } else {
      playNext();
    }
  }
}

function onYTError(e) {
  console.warn('YT error', e.data);
  if (bgMode) {
    // 배경 재생 중 오류 → 그냥 다음 bg 곡으로
    setTimeout(() => playBgNext(), 800);
  } else {
    showToast('재생 불가, 다음 곡으로 / 再生不可、次の曲へ');
    setTimeout(() => playNext(), 1500);
  }
}

function loadVideo(videoId, startedAt) {
  if (!ytReady || !ytPlayer) {
    pendingVideoId = { videoId, startedAt };
    return;
  }
  if (videoId) {
    if (startedAt) {
      const elapsed = (Date.now() - startedAt) / 1000; // ms → 초 (소수점 포함)
      const seekSec = Math.max(0, elapsed);
      ytPlayer.loadVideoById({ videoId: videoId, startSeconds: seekSec });
    } else {
      ytPlayer.loadVideoById(videoId);
    }
  } else {
    ytPlayer.stopVideo();
  }
}

function renderPlayer() {
  const ph = document.getElementById('placeholder');
  const thumbWrap = document.getElementById('npThumbWrap');
  const isBg = current?._bg === true;

  document.getElementById('npTitle').textContent = current ? current.title : '대기 중... / 待機中...';
  const npLabelEl = document.getElementById('npLabel');
  if (npLabelEl) npLabelEl.textContent = isBg
    ? '🎵 taiikukan time! / 自動再生中'
    : '▶ Now Playing / 再生中';
  const npReqEl = document.getElementById('npReq');
  if (npReqEl) npReqEl.innerHTML = current
    ? (isBg
        ? `<span style="color:var(--sky);font-size:.75rem;">대기열이 비어 자동 재생 중입니다 / キューが空のため自動再生中</span>`
        : `신청자 / リクエスト者: <span>${esc(current.requester)}</span>`)
    : '노래를 신청해 주세요 / 曲をリクエストしてください';

  if (current?.thumbnail) {
    thumbWrap.innerHTML = `<img class="np-thumb" src="${current.thumbnail}" alt="">`;
  } else {
    thumbWrap.innerHTML = '🎵';
  }

  // 프로필 아바타 (이퀄라이저 옆 - 회전)
  const npAvatar = document.getElementById('npAvatar');
  if (current?.xAvatar && !isBg) {
    npAvatar.src = current.xAvatar;
    npAvatar.classList.add('visible');
    npAvatar.onerror = () => { npAvatar.classList.remove('visible'); };
  } else {
    npAvatar.classList.remove('visible');
    npAvatar.src = '';
  }


  if (current) {
    ph.style.display = 'none';
    loadVideo(current.videoId, current.startedAt || null);
  } else {
    ph.style.display = '';
    if (ytReady && ytPlayer) ytPlayer.stopVideo();
  }
  renderBgBadge();
}

function setNextSong(key, title) {
  if (nextKey===key) { nextKeyRef.set(null); showToast('다음 곡 설정 해제 / 次の曲の設定を解除'); return; }
  nextKeyRef.set(key);
  showToast(`다음 곡 / 次の曲: ${title.substring(0,22)}...`);
}

function playNext() {
  // 대기열에 곡이 있으면 → 대기열 우선
  const targetKey = nextKey || (queue.length>0 ? queue[0]._key : null);
  if (targetKey) {
    const item = queue.find(q=>q._key===targetKey);
    if (item) {
      bgModeRef.set(false); // 배경 모드 종료
      currentRef.set({videoId:item.videoId, title:item.title, thumbnail:item.thumbnail,
                      requester:item.requester, duration:item.duration||'',
                      xAvatar:item.xAvatar||'', startedAt:Date.now()});
      queueRef.child(targetKey).remove();
      nextKeyRef.set(null);
      return;
    }
  }
  // 대기열 없으면 → 배경 플레이리스트
  startBgPlaylist();
}

// ── 배경 플레이리스트 ──
async function startBgPlaylist() {
  if (bgLoading) return;
  // 이미 bgMode 중이면 그냥 다음 곡만
  if (bgMode && bgPlaylist.length > 0) { playBgNext(); return; }

  bgLoading = true;
  try {
    if (bgPlaylist.length === 0) {
      await loadBgPlaylist();
    }
    if (bgPlaylist.length === 0) { bgLoading = false; return; }
    bgModeRef.set(true);
    bgIndex = Math.floor(Math.random() * bgPlaylist.length);
    playBgCurrent();
  } catch(e) {
    console.warn('배경 플레이리스트 로드 실패:', e);
  } finally {
    bgLoading = false;
  }
}

async function loadBgPlaylist() {
  // 페이지 순회로 전체 목록 가져오기
  let items = [];
  let pageToken = '';
  do {
    const url = `https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&maxResults=50&playlistId=${PLAYLIST_ID}&key=${YT_KEY}${pageToken ? '&pageToken='+pageToken : ''}`;
    const res = await fetch(url);
    const data = await res.json();
    if (data.error) throw new Error(data.error.message);
    (data.items||[]).forEach(item => {
      const vid = item.snippet?.resourceId?.videoId;
      const title = item.snippet?.title;
      const thumb = item.snippet?.thumbnails?.medium?.url || item.snippet?.thumbnails?.default?.url || '';
      if (vid && title && title !== 'Deleted video' && title !== 'Private video') {
        items.push({ videoId: vid, title, thumbnail: thumb });
      }
    });
    pageToken = data.nextPageToken || '';
  } while (pageToken);

  // Fisher-Yates 셔플
  for (let i = items.length-1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i+1));
    [items[i], items[j]] = [items[j], items[i]];
  }
  bgPlaylist = items;
  console.log('배경 플레이리스트 로드:', bgPlaylist.length, '곡');
}

function playBgCurrent() {
  if (!bgPlaylist.length) return;
  bgIndex = bgIndex % bgPlaylist.length;
  const track = bgPlaylist[bgIndex];
  currentRef.set({
    videoId: track.videoId,
    title: track.title,
    thumbnail: track.thumbnail,
    requester: '🎵 taiikukan time!',
    duration: '',
    _bg: true,
    startedAt: Date.now()
  });
}

function playBgNext() {
  bgIndex = (bgIndex + 1) % bgPlaylist.length;
  playBgCurrent();
}

function renderBgBadge() {
  const badge = document.getElementById('bgBadge');
  if (!badge) return;
  badge.style.display = bgMode ? 'flex' : 'none';
}

let toastT;
function showToast(msg) {
  const t = document.getElementById('nextToast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2500);
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/'/g,'&#39;')}

// 📢 공지 시그널
const noticeRef = db.ref('noticeSignal');
let noticeInit = false;
let noticeTimer = null;
noticeRef.on('child_added', snap => {
  if (!noticeInit) return;
  const data = snap.val();
  snap.ref.remove();
  if (data) showNotice(data.msg || '');
});
noticeRef.once('value', () => { noticeInit = true; });

function showNotice(msg) {
  const overlay = document.getElementById('noticeOverlay');
  const msgEl = document.getElementById('noticeMsg');
  const bar = document.getElementById('noticeBar');
  const timer = document.getElementById('noticeTimer');

  msgEl.textContent = msg;
  bar.style.transition = 'none';
  bar.style.width = '100%';
  overlay.classList.add('show');

  let remain = 60;
  timer.textContent = remain + '초 후 자동으로 닫힙니다 / ' + remain + '秒後に自動で閉じます';

  // 프로그레스 바 시작
  requestAnimationFrame(() => {
    bar.style.transition = 'width 60s linear';
    bar.style.width = '0%';
  });

  clearInterval(noticeTimer);
  noticeTimer = setInterval(function() {
    remain--;
    timer.textContent = remain + '초 후 자동으로 닫힙니다 / ' + remain + '秒後に自動で閉じます';
    if (remain <= 0) {
      clearInterval(noticeTimer);
      overlay.classList.remove('show');
    }
  }, 1000);
}

const pinoRef = db.ref('pinoSignal');
let pinoInit = false;
pinoRef.on('child_added', snap => {
  if (!pinoInit) return;
  const data = snap.val();
  snap.ref.remove();
  if (data) spawnPino(data.name || '', data.msg || '', data.xAvatar || '');
});
pinoRef.once('value', () => { pinoInit = true; });

const DEEPL_KEY = '0277df5c-7fdc-4425-a0cd-6db505a7fa0f:fx';

async function translatePino(text) {
  try {
    const isKorean = /[\uAC00-\uD7A3]/.test(text);
    const langPair = isKorean ? 'ko|ja' : 'ja|ko';
    const res = await fetch(
      'https://api.mymemory.translated.net/get?q=' +
      encodeURIComponent(text) + '&langpair=' + langPair
    );
    const data = await res.json();
    return data.responseData?.translatedText || '';
  } catch(e) {
    return '';
  }
}

async function spawnPino(name, msg, xAvatar) {
  const el = document.createElement('div');
  el.className = 'pino-fly';
  const y = Math.random() * 55 + 20;
  el.style.top = y + 'vh';
  const iconHtml = xAvatar
    ? '<img class="pino-avatar" src="' + xAvatar + '" onerror="this.src=\'' + PINO_IMG_MAIN + '\'">'
    : '<img src="' + PINO_IMG_MAIN + '">';

  // 우선 번역 없이 먼저 생성
  el.innerHTML =
    iconHtml +
    '<div class="pino-fly-text-wrap">' +
    '<span class="pino-fly-msg"><span class="pino-fly-name">' + name + '</span> ' + msg + '</span>' +
    '<span class="pino-fly-translation" id="pino-trans-' + Date.now() + '"></span>' +
    '</div>';
  document.documentElement.appendChild(el);
  el.addEventListener('animationend', () => el.remove());

  // 번역 비동기로 채워넣기
  const transEl = el.querySelector('.pino-fly-translation');
  const translated = await translatePino(msg);
  if (translated && transEl) transEl.textContent = translated;
}

function spawnPizza() {
  const el = document.createElement('div');
  el.className = 'pizza-fly';
  el.textContent = '🍕';
  // 화면 세로 15~80% 랜덤
  const y = Math.random() * 65 + 15;
  el.style.top = y + 'vh';
  document.documentElement.appendChild(el);
  el.addEventListener('animationend', () => el.remove());
}
